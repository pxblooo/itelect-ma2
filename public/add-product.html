<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Local Marketplace</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 14px;
      color: #000;
    }
    
    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 6px;
      border: 1px solid #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div style="padding: 20px; max-width: 1400px; margin: 0 auto;">
    <h1 style="margin: 0 0 10px 0; font-size: 24px;">Local Marketplace</h1>
    <p style="margin: 0 0 20px 0;">
      <a href="/" style="color: #0066cc; text-decoration: none;">Home</a> | 
      <a href="/api" style="color: #0066cc; text-decoration: none;">API</a>
      <button class="btn-add-product" onclick="window.location.href='/add-product'">Add Item</button>
    </p>
    <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
    
    <h2 style="font-size: 18px; margin: 20px 0;">Add New Item</h2>
    
    <form action="/add-product" method="POST" id="addProductForm" style="max-width: 300px;">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required min="0" step="0.01">
      </div>
      
      <div class="form-group">
        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required>
      </div>
      
      <div class="form-group">
        <label for="description">Description:</label>
        <input type="text" id="description" name="description">
      </div>
      
      <div class="form-group">
        <label for="seller">Seller:</label>
        <input type="text" id="seller" name="seller" required>
      </div>
      
      <div style="margin-top: 15px;">
        <button type="submit" style="background: #0066cc; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 3px; font-weight: 600; margin-right: 10px;">Create</button>
        <button type="button" onclick="window.location.href='/overview'" style="background: #f0f0f0; border: 1px solid #999; padding: 8px 16px; cursor: pointer; border-radius: 3px;">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('addProductForm').addEventListener('submit', function(e) {
      const name = document.getElementById('name').value.trim();
      const price = document.getElementById('price').value;
      const category = document.getElementById('category').value.trim();
      const seller = document.getElementById('seller').value.trim();
      
      if (!name || !price || !category || !seller) {
        e.preventDefault();
        alert('Please fill in all required fields.');
        return;
      }
      
      if (parseFloat(price) <= 0) {
        e.preventDefault();
        alert('Price must be greater than 0.');
        return;
      }
    });
  </script>
</body>
</html>
